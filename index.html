<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reCAPTCHA — Vérification humaine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glitch-overlay" id="glitchOverlay"></div>
  <div class="cursor-pulse"   id="cursorPulse"></div>

  <div class="noise" id="noiseEl" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg">
      <filter id="noise-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#noise-filter)" opacity="0.04"/>
    </svg>
  </div>

  <div class="main" id="mainPanel">

    <div class="brand-bar">
      <div class="brand-logo"   id="brandLogo">🔒</div>
      <div class="brand-name"   id="brandName">reCAPTCHA</div>
      <div class="brand-secure" id="brandSecure">SÉCURISÉ · v3.2.1</div>
    </div>

    <div class="panel" id="panel">

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>

      <div class="panel-head">
        <div class="panel-title" id="panelTitle">Vérification humaine</div>
        <div class="panel-sub"   id="panelSub">Complétez le défi de sécurité ci-dessous</div>
      </div>

      <div class="panel-body" id="panelBody"></div>

      <div class="stats-bar" id="statsBar">
        <div class="stat-item"><div class="stat-dot" id="dot1"></div><span id="stat1">trust: 0</span></div>
        <div class="stat-item"><div class="stat-dot" id="dot2"></div><span id="stat2">bond: 0</span></div>
        <div class="stat-item"><div class="stat-dot" id="dot3"></div><span id="stat3">état: inactif</span></div>
      </div>

      <div class="panel-foot">
        <div class="foot-icon">🛡️</div>
        <div class="foot-text" id="footText">Protégé par reCAPTCHA — Confidentialité · CGU</div>
        <div class="foot-logo" id="footLogo">Google</div>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="stages.js"></script>
  <script src="main.js"></script>

</body>
</html>
