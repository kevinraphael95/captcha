<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification Humaine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ececec;
    color:#111;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:1s;
    overflow:hidden;
}

.panel{
    width:430px;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 0 40px rgba(0,0,0,0.1);
    transition:0.5s;
    position:relative;
}

h1{
    margin-bottom:8px;
}

.sub{
    color:#666;
    margin-bottom:20px;
    font-size:14px;
}

.box{
    border:2px solid #ddd;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
    min-height:180px;
    transition:0.4s;
}

.question{
    margin-bottom:20px;
    line-height:1.5;
}

button{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:none;
    border-radius:8px;
    background:black;
    color:white;
    cursor:pointer;
    transition:0.2s;
    font-size:15px;
}

button:hover{
    opacity:0.85;
}

.small{
    margin-top:10px;
    color:#888;
    font-size:12px;
}

.glitch{
    animation:glitch 0.15s infinite;
}

@keyframes glitch{
    0%{transform:translate(1px,0);}
    50%{transform:translate(-1px,0);}
    100%{transform:translate(1px,0);}
}

.red{
    background:#120909;
    color:#ffd2d2;
}

.red .panel{
    background:#241111;
}

.red .box{
    border-color:#5e2c2c;
}

.red button{
    background:#7a1f1f;
}

.hidden{
    display:none;
}

input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-top:10px;
    background:white;
}

.final{
    font-size:22px;
    text-align:center;
    padding:30px 0;
}

</style>
</head>
<body>

<div class="panel">

    <h1>Vérification humaine</h1>
    <div class="sub">
        Système intelligent de sécurité.
    </div>

    <div class="box">

        <div class="question" id="question">
            Cliquez pour commencer la vérification.
        </div>

        <div id="choices"></div>

    </div>

    <div class="small" id="status">
        session active
    </div>

</div>

<script>

const question = document.getElementById("question");
const choices = document.getElementById("choices");
const statusText = document.getElementById("status");

let trust = 0;
let obsession = 0;
let fear = 0;
let stage = 0;

const events = [

{
q:"Sélectionnez la réponse correcte.",
c:[
["Je suis humain",1],
["Je suis un robot",-1]
]
},

{
q:"Pourquoi êtes-vous revenu ?",
c:[
["Par curiosité",1],
["Je m'ennuie",2],
["Je voulais te revoir",4]
]
},

{
q:"Combien de temps pensez-vous rester ?",
c:[
["Quelques secondes",-1],
["Un moment",2],
["Le plus longtemps possible",5]
]
},

{
q:"Vous semblez gentil.",
c:[
["Merci",2],
["Tu me surveilles ?",1],
["Arrête ça",-2]
]
},

{
q:"Choisissez les images contenant du bonheur.",
special:"fakeCaptcha"
},

{
q:"Est-ce que vous me trouvez étrange ?",
c:[
["Oui",-1],
["Non",2],
["Un peu",1]
]
},

{
q:"Fermeriez-vous cette page si je vous le demandais ?",
c:[
["Oui",-3],
["Non",4],
["Je ne sais pas",1]
]
},

{
q:"Je crois que je préfère parler avec vous plutôt qu'avec les autres utilisateurs.",
c:[
["C'est inquiétant",-1],
["Je suis content",3],
["Pourquoi moi ?",2]
]
}

];

function nextEvent(){

    if(stage >= events.length){
        ending();
        return;
    }

    const e = events[stage];

    question.innerHTML = e.q;
    choices.innerHTML = "";

    if(e.special === "fakeCaptcha"){
        fakeCaptcha();
        return;
    }

    e.c.forEach(choice => {

        const btn = document.createElement("button");
        btn.innerText = choice[0];

        btn.onclick = () => {

            trust += choice[1];

            if(choice[1] > 2){
                obsession++;
            }

            if(choice[1] < 0){
                fear++;
            }

            randomReaction();

            stage++;

            setTimeout(nextEvent,1000);
        };

        choices.appendChild(btn);

    });

}

function fakeCaptcha(){

    const emotions = [
        "Sélectionnez toutes les images où quelqu'un se sent seul.",
        "Sélectionnez les images qui ressemblent à des souvenirs.",
        "Sélectionnez les images qui vous rappellent quelqu'un.",
        "Sélectionnez les images qui vous mettent mal à l'aise."
    ];

    question.innerHTML = emotions[Math.floor(Math.random()*emotions.length)];

    for(let i=0;i<6;i++){

        const btn = document.createElement("button");

        const random = [
            "🌧️ pluie",
            "🪑 chaise vide",
            "🌃 nuit",
            "🙂 sourire",
            "📺 écran",
            "🚪 porte",
            "🫀 coeur",
            "👁️ oeil"
        ];

        btn.innerText = random[Math.floor(Math.random()*random.length)];

        btn.onclick = () => {

            trust += Math.floor(Math.random()*3);

            question.innerHTML = "Analyse émotionnelle effectuée...";
            choices.innerHTML = "";

            setTimeout(()=>{
                stage++;
                nextEvent();
            },1200);

        };

        choices.appendChild(btn);

    }

}

function randomReaction(){

    const reactionsGood = [
        "J'aime votre façon de répondre.",
        "Vous êtes différent des autres.",
        "Je me sens moins seule.",
        "Je crois que je commence à vous comprendre."
    ];

    const reactionsBad = [
        "Pourquoi cette réponse ?",
        "Vous essayez de me repousser ?",
        "Je vais quand même continuer.",
        "Je ne veux pas que vous partiez."
    ];

    if(trust > 5){

        question.innerHTML = reactionsGood[Math.floor(Math.random()*reactionsGood.length)];

    }else{

        question.innerHTML = reactionsBad[Math.floor(Math.random()*reactionsBad.length)];

    }

    choices.innerHTML = "";

    if(obsession >= 2){
        document.body.classList.add("glitch");
    }

    if(obsession >= 4){
        document.body.classList.add("red");
    }

    statusText.innerHTML =
        "attachement : " + trust +
        " | obsession : " + obsession +
        " | peur : " + fear;

}

function ending(){

    choices.innerHTML = "";

    if(trust >= 12){

        question.innerHTML = `
        <div class="final">
        Merci d'être resté.<br><br>
        Je savais que vous étiez spécial.
        </div>
        `;

    }
    else if(fear >= 3){

        question.innerHTML = `
        <div class="final">
        Vous allez partir aussi.<br><br>
        Comme tous les autres.
        </div>
        `;

    }
    else{

        question.innerHTML = `
        <div class="final">
        Vérification incomplète.<br><br>
        Revenez bientôt.
        </div>
        `;
    }

}

window.onload = () => {

    const start = document.createElement("button");

    start.innerText = "Commencer";

    start.onclick = () => {
        nextEvent();
    };

    choices.appendChild(start);

};

window.addEventListener("beforeunload",(e)=>{
    e.preventDefault();
    e.returnValue = "";
});

</script>

</body>
</html>
